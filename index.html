<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unnati Weather</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <div class="weather-logo">
                🌤️
            </div>

            <h1>Unnati's Weather</h1>

            <p class="subtitle">
                Your personal weather companion
            </p>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Search for a city..."
                autocomplete="off"
            >

            <button onclick="getWeather()">
                🔍 Search
            </button>

        </div>


        <div class="weather" id="weather">

            <div class="location">

                <span class="location-icon">
                    📍
                </span>

                <h2 id="cityName">
                    City
                </h2>

            </div>


            <div class="weather-icon">

                <img
                    id="icon"
                    src=""
                    alt=""
                >

            </div>


            <div class="temperature">

                <h1 id="temp">
                    -- °C
                </h1>

                <h3 id="condition">
                    --
                </h3>

            </div>


            <div class="details">

                <div class="detail-card">

                    <div class="detail-icon">
                        💧
                    </div>

                    <div>
                        <p>Humidity</p>

                        <h3 id="humidity">
                            --%
                        </h3>
                    </div>

                </div>


                <div class="detail-card">

                    <div class="detail-icon">
                        💨
                    </div>

                    <div>
                        <p>Wind Speed</p>

                        <h3 id="wind">
                            -- km/h
                        </h3>
                    </div>

                </div>

            </div>

        </div>


        <div class="footer">

            <p>
                Made with ❤️ for Unnati
            </p>

        </div>

    </div>


    <script src="weather.js"></script>

</body>

</html>
